server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression handled by Traefik gzip middleware

    # Relative Location headers: behind Cloudflare/Traefik nginx sees plain
    # http, so /overview -> /overview/ used to redirect via http://
    absolute_redirect off;

    # One host only: www.mcpforwoocommerce.com -> mcpforwoocommerce.com
    if ($host = www.mcpforwoocommerce.com) {
        return 301 https://mcpforwoocommerce.com$request_uri;
    }

    # llms.txt for AI assistants, served as plain UTF-8 text
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-transform";
    }

    # Cache hashed _next/static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static export with trailingSlash: true — serve <path>/index.html
    location / {
        # no-transform keeps Cloudflare from injecting its Web Analytics beacon
        # (the site uses Umami only)
        add_header Cache-Control "no-transform";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Don't log noisy probes
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
